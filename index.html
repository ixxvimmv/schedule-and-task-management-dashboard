<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dash. — Schedule &amp; Task Dashboard</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] } } }
    };
  </script>
  <link rel="stylesheet" href="styles.css" />
</head>

<body class="bg-gray-100 text-gray-900 font-sans antialiased">
  <div class="shell mx-auto my-3 max-w-[1440px] rounded-2xl border border-gray-200 bg-white shadow-xl shadow-gray-200/70 flex flex-col overflow-hidden">

    <!-- ============ TOP NAVBAR ============ -->
    <header class="flex flex-wrap items-center gap-3 border-b border-gray-100 px-5 py-3">
      <div class="mr-2 text-xl font-extrabold tracking-tight">Dash.</div>

      <nav id="tabs" class="flex gap-1.5" aria-label="Main">
        <button data-action="tab" data-tab="dashboard" class="tab rounded-full px-4 py-2 text-sm font-medium transition">Dashboard</button>
        <button data-action="tab" data-tab="activities" class="tab rounded-full px-4 py-2 text-sm font-medium transition">Activities</button>
        <button data-action="tab" data-tab="reports" class="tab rounded-full px-4 py-2 text-sm font-medium transition">Reports</button>
      </nav>

      <div class="flex-1"></div>

      <label class="relative hidden sm:block">
        <svg class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-gray-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="search" type="search" placeholder="Search events…" autocomplete="off"
               class="w-52 rounded-full border border-gray-200 bg-gray-50 py-2 pl-9 pr-3 text-sm outline-none transition focus:border-blue-400 focus:bg-white focus:ring-2 focus:ring-blue-100" />
      </label>

      <button data-action="add-event" class="rounded-full bg-gray-900 px-4 py-2 text-sm font-semibold text-white transition hover:bg-gray-700">+ Add Event</button>

      <button data-action="export" class="flex items-center gap-2 rounded-full border border-gray-200 bg-white px-4 py-2 text-sm font-semibold text-gray-800 transition hover:border-blue-300 hover:bg-blue-50">
        <svg class="h-4 w-4 text-blue-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/><path d="M12 13v5M9.5 15.5L12 18l2.5-2.5"/></svg>
        <span>Export to Google Calendar</span>
      </button>

      <div class="flex h-9 w-9 items-center justify-center rounded-full bg-indigo-100 text-sm font-bold text-indigo-700" title="Your profile">YO</div>
    </header>

    <div class="flex min-h-0 flex-1 flex-col lg:flex-row">

      <!-- ============ LEFT SIDEBAR ============ -->
      <aside class="side w-full shrink-0 overflow-y-auto border-b border-gray-100 bg-gray-50/70 lg:w-72 lg:border-b-0 lg:border-r">

        <!-- Tasks -->
        <section class="p-5">
          <div class="mb-3 flex items-center justify-between">
            <h2 class="text-sm font-semibold text-gray-500">Task</h2>
            <span id="task-count" class="rounded-full bg-white px-2 py-0.5 text-xs font-medium text-gray-500 ring-1 ring-gray-200"></span>
          </div>
          <ul id="tasks" class="space-y-1.5"></ul>
          <form id="task-form" class="mt-3 flex gap-2">
            <input id="task-input" type="text" maxlength="60" placeholder="Add a task…"
                   class="min-w-0 flex-1 rounded-xl border border-gray-200 bg-white px-3 py-2 text-sm outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-100" />
            <button class="rounded-xl bg-gray-900 px-3 text-lg leading-none text-white hover:bg-gray-700" aria-label="Add task">+</button>
          </form>
        </section>

        <!-- Mini calendar -->
        <section class="border-t border-gray-200/70 p-5">
          <h2 class="mb-3 text-sm font-semibold text-gray-500">Calendar</h2>
          <div id="mini"></div>
        </section>

        <!-- Category filters -->
        <section class="border-t border-gray-200/70 p-5">
          <div class="mb-3 flex items-center justify-between">
            <h2 class="text-sm font-semibold text-gray-500">Categories</h2>
            <button data-action="reset-filters" class="text-xs font-medium text-blue-600 hover:underline">Show all</button>
          </div>
          <div id="filters" class="flex flex-wrap gap-2"></div>
        </section>
      </aside>

      <!-- ============ MAIN ============ -->
      <main class="flex min-w-0 flex-1 flex-col">

        <!-- Dashboard / schedule -->
        <div id="view-dashboard" class="flex min-h-0 flex-1 flex-col">
          <div class="flex flex-wrap items-center gap-3 px-5 py-4">
            <div class="flex items-center gap-1">
              <button data-action="nav-prev" class="icon-btn" aria-label="Previous">
                <svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
              </button>
              <button data-action="nav-next" class="icon-btn" aria-label="Next">
                <svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
              </button>
            </div>
            <div class="min-w-0">
              <h1 id="period-title" class="text-lg font-bold leading-tight"></h1>
              <p id="period-sub" class="text-xs text-gray-400"></p>
            </div>
            <button data-action="today" class="rounded-full border border-gray-200 px-3 py-1.5 text-xs font-semibold text-gray-600 hover:bg-gray-50">Today</button>
            <div class="flex-1"></div>
            <div id="view-toggle" class="inline-flex rounded-full bg-gray-100 p-1 text-sm ring-1 ring-gray-200/70">
              <button data-action="view" data-view="daily" class="seg">Daily</button>
              <button data-action="view" data-view="weekly" class="seg">Weekly</button>
              <button data-action="view" data-view="monthly" class="seg">Monthly</button>
            </div>
          </div>
          <div id="calendar" class="cal-scroll min-h-0 flex-1 overflow-auto border-t border-gray-100"></div>
        </div>

        <div id="view-activities" class="hidden flex-1 overflow-auto p-6"></div>
        <div id="view-reports" class="hidden flex-1 overflow-auto p-6"></div>
      </main>
    </div>
  </div>

  <div id="modal-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
